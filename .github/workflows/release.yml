name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            qt-platform: windows
            qt-arch: win64_msvc2022_64
            qt-kit: msvc2022_64
            artifact: WebcamSettings-Windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            qt-platform: linux
            qt-arch: linux_gcc_64
            qt-kit: gcc_64
            artifact: WebcamSettings-Linux-x64
          - name: macOS universal
            os: macos-14
            qt-platform: mac
            qt-arch: clang_64
            qt-kit: macos
            artifact: WebcamSettings-macOS

    env:
      QT_VERSION: 6.8.3
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dev libpulse-dev libxkbcommon-x11-0

      - name: Install Qt
        shell: bash
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt "${{ matrix['qt-platform'] }}" desktop "$QT_VERSION" "${{ matrix['qt-arch'] }}" --outputdir "$RUNNER_TEMP/Qt" --modules qtmultimedia
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix['qt-kit'] }}/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix['qt-kit'] }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test portable core
        run: ctest --test-dir build -C Release --output-on-failure -R "profile-store-tests|camera-usage-tests|windows-camera-rotation-tests"

      - name: Install portable application
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/package"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C package -czf "${{ matrix.artifact }}.tar.gz" .

      - name: Create macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent package "${{ matrix.artifact }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum WebcamSettings-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $1 == "##" { if (found) exit; found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --title "Webcam Settings $GITHUB_REF_NAME"
